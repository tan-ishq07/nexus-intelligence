version: "3.9"

services:
  nexus-db:
    image: postgres:16-alpine
    container_name: nexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexus_intelligence
      POSTGRES_USER: nexus_admin
      POSTGRES_PASSWORD: nexus_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus_admin -d nexus_intelligence"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexus-network

  nexus-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexus-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://nexus_admin:nexus_secure_password_2026@nexus-db:5432/nexus_intelligence
      - ENVIRONMENT=production
      - API_PORT=8000
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      nexus-db:
        condition: service_healthy
    networks:
      - nexus-network

  nexus-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexus-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      nexus-backend:
        condition: service_healthy
    networks:
      - nexus-network

volumes:
  pgdata:
    driver: local

networks:
  nexus-network:
    driver: bridge
